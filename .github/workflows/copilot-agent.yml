name: copilot-agent

on:
  push:
    paths:
      - "copilot-agent/**"
      - ".github/workflows/copilot-agent.yml"
  pull_request:
    paths:
      - "copilot-agent/**"
      - ".github/workflows/copilot-agent.yml"

jobs:
  qt6:
    name: Qt 6 + WebEngine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-webengine-dev cmake g++

      - name: Configure
        run: cmake -S copilot-agent -B build -DCMAKE_BUILD_TYPE=Release -DCOPILOTAGENT_QT_VERSION=6

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # tst_bridge drives headless Chromium against a local mock page; it sets
      # its own offscreen/no-sandbox environment and needs no network.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  qt5122:
    # The oldest supported Qt, so nothing newer than 5.12 slips into the code.
    name: Qt 5.12.2 + WebEngine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.12.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.12.2"
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebengine

      - name: Install Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbcommon0 libxkbfile1 libfontconfig1 libdbus-1-3 libgl1 libegl1 libasound2t64

      - name: Configure
        run: cmake -S copilot-agent -B build -DCMAKE_BUILD_TYPE=Release -DCOPILOTAGENT_QT_VERSION=5

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc2019-x86:
    # Qt 5.12.2's 32-bit MSVC kit (built with 2017), compiled with the
    # MSVC 2019 toolset (14.29) for x86.
    name: Qt 5.12.2 MSVC 2019 32-bit (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: MSVC 2019 x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: "14.29"

      - name: Install Qt 5.12.2 (win32_msvc2017)
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.12.2"
          host: windows
          target: desktop
          arch: win32_msvc2017
          modules: qtwebengine

      - name: Configure
        run: cmake -S copilot-agent -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOPILOTAGENT_QT_VERSION=5

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
