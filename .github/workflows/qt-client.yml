name: qt-client

on:
  push:
    paths:
      - "qt-jira-client/**"
      - ".github/workflows/qt-client.yml"
  pull_request:
    paths:
      - "qt-jira-client/**"
      - ".github/workflows/qt-client.yml"

jobs:
  build:
    # Both supported Qt majors, so the one nobody develops against cannot
    # quietly stop compiling.
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    name: Qt ${{ matrix.qt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt }}
        run: |
          sudo apt-get update
          if [ "${{ matrix.qt }}" = "6" ]; then
            sudo apt-get install -y qt6-base-dev qt6-base-dev-tools cmake g++
          else
            sudo apt-get install -y qtbase5-dev qtbase5-dev-tools cmake g++
          fi

      - name: Configure
        run: >
          cmake -S qt-jira-client -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJIRADESK_QT_VERSION=${{ matrix.qt }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The tests need no display and no network -- the Jira layer is exercised
      # through parsed payloads, not a server.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The test generator writes C++, so the thing worth checking is that its
      # output still compiles -- on Qt 5 as well, where Q_DECLARE_METATYPE is
      # not optional. The skeletons are not run: they fail until written.
      - name: Generated tests compile
        run: qt-jira-client/tools/compile-check.sh ${{ matrix.qt }}

  tools:
    name: qtestgen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s qt-jira-client/tools -t qt-jira-client/tools -v
